services:
  salvage-pulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: salvage-pulse-ai:latest
    container_name: salvage-pulse-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATA_DIR=/app/backend/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - APP_URL=${APP_URL:-https://app.salvagepulsepro.com}
      - COOKIE_SECURE=${COOKIE_SECURE:-1}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-0}
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-0}
      - DEMO_LOGIN_ENABLED=${DEMO_LOGIN_ENABLED:-0}
      - INITIAL_MASTER_EMAIL=${INITIAL_MASTER_EMAIL:-brettk@salvagepulsepro.com}
      - INITIAL_MASTER_NAME=${INITIAL_MASTER_NAME:-Brett K}
      - INITIAL_MASTER_PASSWORD=${INITIAL_MASTER_PASSWORD:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - INGEST_STT_PROVIDER=${INGEST_STT_PROVIDER:-auto}
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY:-}
      - ASSEMBLYAI_API_KEY=${ASSEMBLYAI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_STT_MODEL=${OPENAI_STT_MODEL:-whisper-1}
      - TELNYX_API_KEY=${TELNYX_API_KEY:-}
      - MAX_INGEST_MB=${MAX_INGEST_MB:-100}
      - INGEST_MEDIA_MAX_MB=${INGEST_MEDIA_MAX_MB:-100}
      - INGEST_ALLOW_PRIVATE_MEDIA_HOSTS=${INGEST_ALLOW_PRIVATE_MEDIA_HOSTS:-0}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-support@salvagepulsepro.com}
    volumes:
      # Persist dynamic state & uploads across container restarts
      - app-data:/app/backend/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  app-data:
